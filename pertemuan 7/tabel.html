<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabel Mahasiswa</title>

    <style>
      td,
      th {
        border-bottom: 1px solid green;
        padding: 10px;
      }

      th {
        background-color: green;
        color: white;
        border-bottom: 1px solid rgb(50, 108, 50);
      }

      table {
        border-collapse: collapse;
        font-family: Arial, Helvetica, sans-serif;
        width: 100%;
      }

      caption {
        padding: 10px;
        font-weight: bold;
      }

      tbody tr {
        cursor: pointer;
      }

      tbody tr:hover {
        background-color: #e88585;
        color: rgb(227, 227, 227);
      }

      tfoot td {
        text-align: center;
      }

      tr:nth-child(odd) {
        background-color: #e7e7e7;
        color: #ffff;
        text-shadow:
          2px 2px 3px rgb(255, 0, 0),
          -2px -2px green,
          -5px 3px 3px blue;
      }

      .tbl-responsive {
        overflow-x: auto;
        width: 100%;
      }
    </style>
  </head>

  <body>
    <div class="tbl-responsive">
      <table>
        <caption>
          Tabel Mahasiswa
        </caption>

        <thead>
          <tr>
            <th rowspan="2">No</th>
            <th rowspan="2">NIM</th>
            <th colspan="3">Mahasiswa</th>
          </tr>
          <tr>
            <th>Nama</th>
            <th>Prodi</th>
            <th>Alamat</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td>1</td>
            <td>23001</td>
            <td>Abima Algifari</td>
            <td>TI</td>
            <td>Gunung Medan</td>
          </tr>
          <tr>
            <td>2</td>
            <td>23002</td>
            <td>ADZIA SUKMA ERITA</td>
            <td>TI</td>
            <td>Sikabau</td>
          </tr>
          <tr>
            <td>3</td>
            <td>23003</td>
            <td>AGA SILVIO YONIDRA</td>
            <td>TI</td>
            <td>Blok B</td>
          </tr>
        </tbody>

        <tfoot>
          <tr>
            <td colspan="4">jumlah</td>
            <td>3</td>
          </tr>
        </tfoot>
      </table>
    </div>
  </body>
</html>
