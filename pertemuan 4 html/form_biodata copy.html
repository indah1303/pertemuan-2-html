<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>biodata</title>
  </head>

  <body>
    <form action="proses.html" method="get">
      <label for="nama">Nama</label
      ><input type="text" name="nama" id="nama" value="Indah" /><br />
      <label for="tmpt_lahir">Tempat Lahir</label
      ><input
        type="text"
        name="tmpt_lahir"
        id="tmpt_lahir"
        value="Tebo"
      /><br />
      <label for="tgl_lahir">Tanggal Lahir</label
      ><input
        type="date"
        name="tgl_lahir"
        id="tgl_lahir"
        value="2006-03-13"
      /><br />

      <p>hobi(bisa lebih dari 1 pilihan)</p>
      <label for="berenang">berenang</label
      ><input
        type="checkbox"
        name="hobi[]"
        checked
        id="berenang"
        value="berenang"
      />
      <label for="membaca">membaca</label
      ><input
        type="checkbox"
        name="hobi[]"
        checked
        id="membaca"
        value="membaca"
      />
      <label for="melukis">melukis</label
      ><input type="checkbox" name="hobi[]" id="melukis" value="melukis" />
      <br />
      <p>jenis kelamin</p>
      <label for="L">laki-laki</label
      ><input type="radio" name="jk" id="L" value="L" />
      <label for="p">perempuan</label
      ><input type="radio" name="jk" id="P" checked value="P" />
      <input type="submit" value="simpan" />
    </form>
  </body>
</html>
